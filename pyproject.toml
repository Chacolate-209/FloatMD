[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floatmd"
version = "0.1.0"
description = "Lightweight floating Markdown notes for the desktop (Qt / Python)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FloatMD" }]
dependencies = [
  "PySide6>=6.6",
  "markdown>=3.5",
  "pymdown-extensions>=10.0",
  "httpx>=0.27",
  "keyring>=25",
  "appdirs>=1.4",
  "mss>=9.0",
  "Pillow>=10.0",
  "rapidocr-onnxruntime>=1.3",
]

[project.optional-dependencies]
ocr-paddle = ["paddlepaddle>=2.6", "paddleocr>=2.7"]
dev = ["ruff>=0.4", "pytest>=8"]

[project.scripts]
floatmd = "floatmd.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["floatmd*"]

[tool.setuptools.package-data]
floatmd = ["resources/**/*"]
