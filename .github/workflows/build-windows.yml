name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    paths:
      - "floatmd/**"
      - "floatmd.spec"
      - "scripts/build_windows.ps1"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pyinstaller>=6.0" "appdirs>=1.4"

      - name: Build green folder + zip
        shell: pwsh
        run: |
          .\scripts\build_windows.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatMD-windows-x64
          path: dist/FloatMD-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release asset (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FloatMD-windows-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
